<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Asistente - SgOVI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" th:href="@{/css/usuario.css}">
</head>
<body class="sidebar-layout">

<div th:replace="~{fragments/sidebar :: sidebar(activePage='solicitudes')}"></div>

<main class="main-content">
    <h1 class="page-title">Detalle del Asistente</h1>

    <div class="detail-card">
        <div class="section-row">
            <span class="info-label">Nombre Completo</span>
            <span th:text="${asistente.nombre}">Nombre</span>
        </div>

        <div class="section-row">
            <span class="info-label">Email</span>
            <span th:text="${asistente.email}">email@ejemplo.com</span>
        </div>

        <div class="section-row">
            <span class="info-label">Fecha de nacimiento</span>
            <span th:text="${asistente.fechaNacimiento != null} ? ${#temporals.format(asistente.fechaNacimiento, 'dd/MM/yyyy')} : '-'">-</span>
        </div>

<div class="section-row">
            <span class="info-label">Municipio</span>
            <span th:text="${asistente.municipio} ?: '-'"></span>
        </div>

        <div class="section-row">
            <span class="info-label">Disponibilidad</span>
            <span th:text="${asistente.disponibilidad} ?: '-'"></span>
        </div>

        <div class="section-row" th:if="${asistente.formacionPrevia}">
            <span class="info-label">Formación Previa:</span>
            <span th:text="${asistente.formacionPrevia}"></span>
        </div>

        <div class="form-actions">
            <a th:href="@{/peticionAP/candidatos/{id}(id=${peticion.idSolicitud})}" class="btn btn-outline">Volver a candidatos</a>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 SgOVI - Oficina per la Vida Independent de Castelló</p>
    </footer>
</main>
</body>
</html>
