<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Contrato - SgOVI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" th:href="@{/css/usuario.css}">
</head>
<body class="sidebar-layout">

<th:block th:if="${session.tipo == 'asistente'}">
    <div th:replace="~{fragments/sidebar-asistente :: sidebar(activePage='contratos')}"></div>
</th:block>
<th:block th:if="${session.tipo != 'asistente'}">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='contratos')}"></div>
</th:block>

<main class="main-content">
    <h1 class="page-title">Editar Contrato</h1>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="form-card">
        <form th:action="@{/registroContacto/update}" method="post" enctype="multipart/form-data" th:object="${registroContacto}">
            <input type="hidden" name="idReg" th:value="*{idReg}">
            <input type="hidden" name="idSeleccion" th:value="*{idSeleccion}">
            <input type="hidden" name="resultado" th:value="*{resultado}">

            <p class="required-text"><abbr title="campo obligatorio">*</abbr> Campos obligatorios</p>

            <div class="form-row">
                <div class="form-group">
                    <label for="tipoContrato" class="form-label">Tipo de contrato <abbr title="campo obligatorio">*</abbr></label>
                    <input type="text" id="tipoContrato" class="form-control" th:field="*{tipoContrato}" placeholder="Ej: Servicio de Asistencia Personal" maxlength="200">
                    <span th:if="${#fields.hasErrors('tipoContrato')}" th:errors="*{tipoContrato}" class="field-error"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="fechaInicio" class="form-label">Fecha de inicio <abbr title="campo obligatorio">*</abbr></label>
                    <input type="date" id="fechaInicio" class="form-control" th:field="*{fechaInicio}">
                    <span th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}" class="field-error"></span>
                </div>
                <div class="form-group">
                    <label for="fechaFin" class="form-label">Fecha de fin <abbr title="campo obligatorio">*</abbr></label>
                    <input type="date" id="fechaFin" class="form-control" th:field="*{fechaFin}">
                    <span th:if="${#fields.hasErrors('fechaFin')}" th:errors="*{fechaFin}" class="field-error"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="archivo" class="form-label">Archivo PDF del contrato</label>
                <input type="file" id="archivo" name="archivo" class="form-control" accept=".pdf,application/pdf">
                <small class="text-muted">Deja este campo vacio si no quieres cambiar el PDF actual.</small>
                <div th:if="${registroContacto.rutaPdf != null}" class="mt-1">
                    <small>PDF actual: <a th:href="@{/registroContacto/pdf/{id}(id=${registroContacto.idReg})}" th:text="${registroContacto.rutaPdf}"></a></small>
                </div>
            </div>

            <div class="form-group">
                <label for="observaciones" class="form-label">Observaciones</label>
                <textarea id="observaciones" class="form-control" th:field="*{observaciones}" placeholder="Opcional: anota cualquier detalle relevante" rows="3" maxlength="500"></textarea>
                <span th:if="${#fields.hasErrors('observaciones')}" th:errors="*{observaciones}" class="field-error"></span>
            </div>

            <div class="form-actions">
                <label for="updateContratoToggle" class="btn btn-primary">Guardar Cambios</label>
                <a th:href="@{/registroContacto/list}" class="btn btn-outline">Cancelar</a>
            </div>

            <input type="checkbox" id="updateContratoToggle" class="notice-toggle">
            <div class="window-notice">
                <div class="content">
                    <div class="content-text">¿Estas seguro/a de que quieres actualizar este contrato?<br>Este cambio no se puede deshacer.</div>
                    <div class="content-buttons">
                        <button type="button" class="btn btn-outline" onclick="document.getElementById('updateContratoToggle').checked = false">Volver</button>
                        <button type="submit" class="btn btn-primary">Si, actualizar contrato</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</main>

</body>
</html>
