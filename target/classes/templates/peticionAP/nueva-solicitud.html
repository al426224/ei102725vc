<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Solicitud AP - SgOVI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" th:href="@{/css/usuario.css}">
</head>
<body class="sidebar-layout">

<div th:replace="~{fragments/sidebar :: sidebar(activePage='nueva')}"></div>

<main class="main-content">
    <h1 class="page-title">Nueva Solicitud de Asistencia</h1>

    <div class="form-card">
        <form th:action="@{/peticionAP/nueva}" method="post" th:object="${peticionAP}" id="solicitudForm">
            <p class="required-text"><abbr title="campo obligatorio">*</abbr> Campos obligatorios</p>

            <div class="form-row">
                <div class="form-group">
                    <label for="fechaInicioPrevista" class="form-label">Fecha de inicio prevista <abbr title="campo obligatorio">*</abbr></label>
                    <input type="date" id="fechaInicioPrevista" class="form-control" th:field="*{fechaInicioPrevista}">
                    <span th:if="${#fields.hasErrors('fechaInicioPrevista')}" th:errors="*{fechaInicioPrevista}" class="field-error"></span>
                </div>

                <div class="form-group">
                    <label for="municipio" class="form-label">Municipio <abbr title="campo obligatorio">*</abbr></label>
                    <input type="text" id="municipio" class="form-control" th:field="*{municipio}" placeholder="Ej: Castello de la Plana" maxlength="100">
                    <span th:if="${#fields.hasErrors('municipio')}" th:errors="*{municipio}" class="field-error"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="horasSemanales" class="form-label">Horas semanales <abbr title="campo obligatorio">*</abbr></label>
                    <input type="number" id="horasSemanales" class="form-control" th:field="*{horasSemanales}" min="1" max="168">
                    <span th:if="${#fields.hasErrors('horasSemanales')}" th:errors="*{horasSemanales}" class="field-error"></span>
                </div>

                <div class="form-group">
                    <label for="tipoTareas" class="form-label">Tipo de tareas <abbr title="campo obligatorio">*</abbr></label>
                    <select id="tipoTareas" class="form-control" th:field="*{tipoTareas}">
                        <option value="">Selecciona tipo de tarea</option>
                        <option value="Acompanyamiento educativo">Acompañamiento educativo</option>
                        <option value="Acompanyamiento laboral">Acompañamiento laboral</option>
                        <option value="Cuidado personal">Cuidado personal</option>
                        <option value="Movilidad">Movilidad</option>
                        <option value="Asistencia en domicilio">Asistencia en domicilio</option>
                        <option value="Ocio y tiempo libre">Ocio y tiempo libre</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="tiempoPreferido" class="form-label">Tiempo preferido <abbr title="campo obligatorio">*</abbr></label>
                <input type="text" id="tiempoPreferido" class="form-control" th:field="*{tiempoPreferido}" placeholder="Ej: Mananas de 9h a 13h" maxlength="500">
                <span th:if="${#fields.hasErrors('tiempoPreferido')}" th:errors="*{tiempoPreferido}" class="field-error"></span>
            </div>

            <div class="form-group">
                <label for="descripcion" class="form-label">Descripcion de la necesidad</label>
                <textarea id="descripcion" class="form-control" th:field="*{descripcion}" placeholder="Describe brevemente tu situacion y necesidades" rows="3" maxlength="500"></textarea>
            </div>

            <h3 class="section-title">Preferencias</h3>

            <div class="form-row">
                <div class="form-group">
                    <label for="preferenciaGenero" class="form-label">Genero preferido</label>
                    <select id="preferenciaGenero" class="form-control" th:field="*{preferenciaGenero}">
                        <option value="Sin preferencia">Sin preferencia</option>
                        <option value="Hombre">Hombre</option>
                        <option value="Mujer">Mujer</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="idiomasRequeridos" class="form-label">Idiomas requeridos</label>
                    <input type="text" id="idiomasRequeridos" class="form-control" th:field="*{idiomasRequeridos}" placeholder="Ej: Valenciano" maxlength="100">
                </div>
            </div>

            <div class="form-group">
                <label for="preferencias" class="form-label">Otras observaciones</label>
                <textarea id="preferencias" class="form-control" th:field="*{preferencias}" placeholder="Otras preferencias o comentarios" rows="3" maxlength="500"></textarea>
            </div>

            <div class="form-actions">
                <label for="nuevaSolicitudToggle" class="btn btn-primary">Enviar Solicitud</label>
                <a th:href="@{/usuarioOVI/homeUsuarioOVI}" class="btn btn-outline">Cancelar</a>
            </div>

            <input type="checkbox" id="nuevaSolicitudToggle" class="notice-toggle">
            <div class="window-notice">
                <div class="content">
                    <div class="content-text">¿Estas seguro/a de que quieres enviar esta solicitud?<br>¿Son todos los datos correctos?</div>
                    <div class="content-buttons">
                        <button type="button" class="btn btn-outline" onclick="document.getElementById('nuevaSolicitudToggle').checked = false">Volver</button>
                        <button type="submit" class="btn btn-primary" formnovalidate>Si, enviar</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</main>

</body>
</html>
