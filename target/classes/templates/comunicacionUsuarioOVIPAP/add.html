<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva comunicación - SgOVI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" th:href="@{/css/usuario.css}">
</head>
<body class="sidebar-layout">

<div th:replace="~{fragments/sidebar-tecnico :: sidebar(activePage='dashboard')}"></div>

<main class="main-content">
    <h1 class="page-title">Nueva comunicación</h1>

    <div class="form-card-centered">
        <form th:action="@{/comunicacionUsuarioOVIPAP/add}" th:object="${comunicacion}" method="post">
            <div class="form-group">
                <label class="form-label" for="idSeleccion">ID Selección</label>
                <input id="idSeleccion" class="form-control" type="number" min="1" th:field="*{idSeleccion}">
                <span class="field-error" th:if="${#fields.hasErrors('idSeleccion')}" th:errors="*{idSeleccion}"></span>
            </div>

            <div class="form-group">
                <label class="form-label" for="emisor">Emisor</label>
                <input id="emisor" class="form-control" type="text" maxlength="20" th:field="*{emisor}">
                <span class="field-error" th:if="${#fields.hasErrors('emisor')}" th:errors="*{emisor}"></span>
            </div>

            <div class="form-group">
                <label class="form-label" for="mensaje">Mensaje</label>
                <textarea id="mensaje" class="form-control" rows="4" maxlength="200" th:field="*{mensaje}"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('mensaje')}" th:errors="*{mensaje}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/comunicacionUsuarioOVIPAP/list}" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
